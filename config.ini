[settings]
; 默认串口号。留空时自动选择系统枚举到的第一个可用串口。
port =

; 检测波长，允许值：410/460/520/550/590/630，单位 nm。
wavelength = 520

; 通道组：0=CH1-CH24，1=CH1-CH12，2=CH13-CH24。
channel_group = 0

; 运行模式：filter=通用滤光片检测，air=只记录空气数据。
test_mode = filter

; 输出文件名。程序会在每次检测的数据目录中生成文件。
output = 串口数据记录.xlsx
stable_output = 滤光片稳定值.xlsx

; 滤光片判稳窗口帧数。增大更稳但等待更久，必须大于等于 2。
filter_stable_window_frames = 10

; 滤光片窗口样本 CV 上限，单位 %。调小会更严格。
filter_stable_cv_limit = 0.25

; 滤光片窗口绝对斜率上限，单位：百分点/帧。调小会更严格。
filter_stable_slope_limit = 0.02

; 滤光片窗口透过率极差上限，单位：百分点。调小会更严格。
filter_stable_range_limit = 0.25

; 空气范围容差，单位：百分点。
; 透过率低于 100%-该值时自动识别为插入滤光片；拔片后回到 100%±该值才判定为空气。
; 调小可检测更接近透明的滤光片，但也更容易把空气波动识别为插片。
air_tolerance = 5

; 初次空气基底判稳前的最短暖机时间，单位：秒。
air_warmup_seconds = 30

; 空气判稳窗口帧数。增大更稳但等待更久，必须大于等于 2。
air_stable_window_frames = 20

; 空气窗口样本 CV 上限，单位 %。调小会更严格。
air_stable_cv_limit = 0.25

; 空气窗口绝对斜率上限，单位：百分点/帧。调小会更严格。
air_stable_slope_limit = 0.03

; 空气窗口透过率极差上限，单位：百分点。调小会更严格。
air_stable_range_limit = 0.50

; true=不发送开灯命令，只读取设备已经输出的数据流。
no_start = false

; true=停止检测时不发送关灯命令。
keep_light = false
